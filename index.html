<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolutionYours — Official Apps & Links</title>
    <meta name="description" content="SolutionYours — Innovative AI-powered apps for everyone.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow bg-glow-1"></div>
    <div class="background-glow bg-glow-2"></div>
    <canvas id="stars"></canvas>

    <div class="container">
        <header class="profile">
            <div class="avatar-wrapper">
                <img id="logo-img" src="logo.png" alt="SolutionYours Logo" class="avatar-img"
                     onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex'">
                <div id="logo-fallback" class="logo-fallback">SY</div>
                <div class="pulse-ring"></div>
            </div>
            <h1 class="brand-title" id="brand-name"></h1>
            <p class="brand-tagline" id="brand-tagline"></p>
            <div class="badge" id="brand-badge"></div>
        </header>

        <main class="links-list" id="links-container"></main>

        <footer class="footer">
            <p>© 2026 SolutionYours • All rights reserved.</p>
        </footer>
    </div>

    <script src="links.js"></script>
    <script>
        // Sayfayı config'den otomatik oluştur
        document.getElementById('brand-name').textContent = CONFIG.name;
        document.getElementById('brand-tagline').textContent = CONFIG.tagline;
        document.getElementById('brand-badge').textContent = CONFIG.badge;
        document.getElementById('logo-img').src = CONFIG.logo;

        const container = document.getElementById('links-container');
        CONFIG.links.forEach(link => {
            const a = document.createElement('a');
            a.href = link.url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.className = 'link-card' + (link.featured ? ' featured' : '');
            a.innerHTML = `
                <div class="link-icon">${link.icon}</div>
                <div class="link-content">
                    <span class="link-title">${link.title}</span>
                    <span class="link-subtitle">${link.subtitle}</span>
                </div>
                <div class="link-arrow">→</div>
            `;
            container.appendChild(a);
        });

        // Yıldız animasyonu (Logo ile uyumlu)
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.zIndex = '0';
        canvas.style.pointerEvents = 'none';

        const stars = Array.from({ length: 60 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.5 + 0.5,
            o: Math.random(),
            s: Math.random() * 0.005 + 0.002
        }));

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.o += star.s;
                if (star.o > 1 || star.o < 0) star.s *= -1;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(140, 180, 255, ${star.o * 0.6})`;
                ctx.fill();
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();
    </script>
</body>
</html>
