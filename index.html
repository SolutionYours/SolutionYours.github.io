<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolutionYours — Solo Indie iOS Developer</title>
    <meta name="description" content="Official portfolio of SolutionYours. Building innovative, AI-powered iOS mobile apps as a solo developer.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow bg-glow-1"></div>
    <div class="background-glow bg-glow-2"></div>
    <canvas id="stars"></canvas>

    <div class="container">
        <!-- Profile Header -->
        <header class="profile">
            <div class="avatar-wrapper">
                <img id="logo-img" src="logo.png" alt="SolutionYours Logo" class="avatar-img"
                     onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex'">
                <div id="logo-fallback" class="logo-fallback">SY</div>
                <div class="pulse-ring"></div>
            </div>
            
            <h1 class="brand-title" id="brand-name"></h1>
            <p class="brand-role" id="brand-role"></p>
            <div class="badge" id="brand-badge"></div>
            
            <!-- Solo Dev Bio Box -->
            <div class="bio-box">
                <p id="brand-bio"></p>
            </div>
        </header>

        <!-- Apps Grid Section -->
        <section class="section-container">
            <h2 class="section-title">My Apps</h2>
            <div class="apps-grid" id="apps-container"></div>
        </section>

        <!-- Social Media Footer Connections -->
        <section class="section-container">
            <h2 class="section-title">Connect With Me</h2>
            <div class="social-row" id="socials-container"></div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 SolutionYours • Crafted solo with passion.</p>
        </footer>
    </div>

    <script src="links.js"></script>
    <script>
        // Load configurations
        document.getElementById('brand-name').textContent = CONFIG.developerName;
        document.getElementById('brand-role').textContent = CONFIG.role;
        document.getElementById('brand-badge').textContent = CONFIG.badge;
        document.getElementById('brand-bio').textContent = CONFIG.bio;
        document.getElementById('logo-img').src = CONFIG.logo;

        // Render Apps
        const appsContainer = document.getElementById('apps-container');
        CONFIG.apps.forEach(app => {
            const card = document.createElement(app.isLive ? 'a' : 'div');
            if (app.isLive) {
                card.href = app.url;
                card.target = '_blank';
                card.rel = 'noopener';
            }
            card.className = 'app-card' + (app.isLive ? ' live' : ' dev');
            
            const badgeClass = app.isLive ? 'status-live' : 'status-dev';
            
            card.innerHTML = `
                <div class="app-card-header">
                    <span class="app-icon">${app.icon}</span>
                    <span class="app-status-badge ${badgeClass}">${app.status}</span>
                </div>
                <h3 class="app-title">${app.title}</h3>
                <span class="app-subtitle">${app.subtitle}</span>
                <p class="app-description">${app.description}</p>
                ${app.isLive ? '<div class="app-action">View on App Store →</div>' : ''}
            `;
            appsContainer.appendChild(card);
        });

        // Render Socials
        const socialsContainer = document.getElementById('socials-container');
        CONFIG.socials.forEach(social => {
            const a = document.createElement('a');
            a.href = social.url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.className = 'social-btn';
            a.innerHTML = `
                <span class="social-icon">${social.icon}</span>
                <span class="social-name">${social.platform}</span>
            `;
            socialsContainer.appendChild(a);
        });

        // Star animation
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.zIndex = '0';
        canvas.style.pointerEvents = 'none';

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const stars = Array.from({ length: 60 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.5 + 0.5,
            o: Math.random(),
            s: Math.random() * 0.005 + 0.002
        }));

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.o += star.s;
                if (star.o > 1 || star.o < 0) star.s *= -1;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(140, 180, 255, ${star.o * 0.6})`;
                ctx.fill();
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();
    </script>
</body>
</html>
